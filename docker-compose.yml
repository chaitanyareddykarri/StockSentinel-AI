services:
  web:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.web
    container_name: stocksentinel-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DETECTION_SERVICE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.api
    container_name: stocksentinel-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

